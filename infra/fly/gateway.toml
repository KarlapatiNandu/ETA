# Fly.io — the gateway (BUILD_PLAN Stage 9, ARCH §9). Mumbai, next to Supabase ap-south-1.
#   fly deploy -c infra/fly/gateway.toml --dockerfile infra/docker/Dockerfile.node \
#     --build-arg APP=gateway --build-arg ENTRY=src/server.ts
# Secrets (fly secrets set …): DATABASE_URL, SUPABASE_*, REDIS_URL, CLAIM_DECOY_KEY,
# TRACKER_SECRET_KEY, VAPID_*, SMS_*, MSG91_*, SMS_RECEIPT_TOKEN, OTEL_EXPORTER_OTLP_HEADERS.
app = "busmitra-gateway"
primary_region = "bom"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  dockerfile = "../docker/Dockerfile.node"
  [build.args]
    APP = "gateway"
    ENTRY = "src/server.ts"

[env]
  NODE_ENV = "production"
  GATEWAY_PORT = "4000"
  WEB_ORIGIN = "https://busmitra.in"
  DRIVER_ORIGIN = "https://driver.busmitra.in"
  OTEL_EXPORTER_OTLP_ENDPOINT = "https://otlp-gateway-prod-ap-south-1.grafana.net/otlp"
  OTEL_TRACES_SAMPLER = "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG = "0.1"

[http_service]
  internal_port = 4000
  force_https = true
  # SSE streams are long-lived; never stop a machine with students on it
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2
  [http_service.concurrency]
    # connections, not requests: every open app is one SSE stream (ARCH §7)
    type = "connections"
    soft_limit = 800
    hard_limit = 1200
  [http_service.http_options]
    # HTTP/2 to the browser (Fly's edge speaks it by default): several tabs × SSE on HTTP/1.1
    # hit the browser's 6-connections-per-origin limit (M03 carried forward)
    h2_backend = false
  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
