name: backup
# Nightly off-site logical backup (BUILD_PLAN Stage 9), on top of Supabase Pro's own backups.
# Does nothing until the secrets exist: PROD_DATABASE_URL, BACKUP_PASSPHRASE, BACKUP_S3_URI,
# AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (+ BACKUP_S3_ENDPOINT for Cloudflare R2).
on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST, after the day's last trip
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      HAVE_SECRETS: ${{ secrets.PROD_DATABASE_URL != '' && secrets.BACKUP_PASSPHRASE != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAVE_SECRETS == 'true'
      - name: dump, encrypt, upload
        if: env.HAVE_SECRETS == 'true'
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_S3_URI: ${{ secrets.BACKUP_S3_URI }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: BACKUP_DIR=./backups bash infra/scripts/backup.sh
      - name: not configured
        if: env.HAVE_SECRETS != 'true'
        run: echo "backup secrets are not set — see vault/runbooks/deploy.md §4"
